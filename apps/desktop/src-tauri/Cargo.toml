[package]
name = "agentic-hub-desktop"
version = "0.3.0"
description = "Agentic Hub desktop app"
edition = "2021"
rust-version = "1.80"

[lib]
name = "agentic_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
# Loopback-only HTTP to the local runtime, so no TLS stack is needed.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
libc = "0.2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
